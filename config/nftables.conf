#!/usr/sbin/nft -f

flush ruleset

table inet captive {
    set authorized_macs {
        type ether_addr
        flags timeout
        timeout 8h
    }

    set walled_garden_ips {
        type ipv4_addr
        flags timeout
        timeout 1h
    }

    # Populated at runtime by the admin panel (one rule per limited MAC).
    # Hook priority -10 so these drops run BEFORE the forward chain accepts.
    # Volatile: re-applied by captive-bw-sync.service after nftables (re)loads.
    chain bandwidth_limits {
        type filter hook forward priority -10; policy accept;
    }

    # Per-MAC byte counters, installed when a device is authorized and removed
    # when it is revoked. Priority -20 runs before bandwidth_limits so traffic is
    # counted even if it is subsequently dropped by a rate limit.
    chain accounting {
        type filter hook forward priority -20; policy accept;
    }

    chain input {
        type filter hook input priority 0; policy accept;

        # Admin panel (3001) must never be reachable from the captive VLAN.
        iifname "eth1" tcp dport 3001 drop

        iifname "eth1" udp dport { 53, 67, 68 } accept
        iifname "eth1" tcp dport { 53, 80, 3000 } accept
    }

    chain forward {
        type filter hook forward priority 0; policy accept;
        ct state established,related counter accept
        iifname "eth1" oifname "eth0" ether saddr @authorized_macs counter accept
        iifname "eth1" oifname "eth0" ip daddr @walled_garden_ips counter accept
        iifname "eth1" counter drop
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        iifname "eth1" ether saddr != @authorized_macs tcp dport 80 dnat ip to 10.50.0.1:3000
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "eth0" ip saddr 10.50.0.0/24 masquerade
    }
}
